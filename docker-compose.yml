version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: visual-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visual_search_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visual_search_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - visual-search-net

  # 2. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: visual-search-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visual-search-net

  # 3. MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: visual-search-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visual-search-net

  # MinIO Bucket Auto-creator
  minio-init:
    image: minio/mc:latest
    container_name: visual-search-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-miniopassword}; /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_IMAGES:-images}; /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_THUMBNAILS:-thumbnails}; /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_THUMBNAILS:-thumbnails}; /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_IMAGES:-images}; exit 0; "
    networks:
      - visual-search-net

  # 4. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: visual-search-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visual-search-net

  # 5. AI Service (FastAPI + SigLIP + EasyOCR)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: visual-search-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - APP_ENV=production
      - SIGLIP_MODEL_NAME=${SIGLIP_MODEL_NAME:-google/siglip-base-patch16-224}
      - EASYOCR_LANGUAGES=${EASYOCR_LANGUAGES:-en,vi}
    volumes:
      - ai_models_cache:/root/.cache
    networks:
      - visual-search-net

  # 6. Core Backend (Java Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visual-search-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-visual_search_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER:-guest}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS:-guest}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-miniopassword}
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_at_least_256_bits_long_for_security}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS:-604800000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - visual-search-net

  # 7. Frontend (React + Vite + Tailwind + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visual-search-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    depends_on:
      - backend
    networks:
      - visual-search-net

# Networks & Volumes
networks:
  visual-search-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  rabbitmq_data:
  ai_models_cache:

server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: visual-search-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/visual_search_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 500MB

# Custom app configuration
app:
  # RabbitMQ Queue & Exchange names
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:visual.search.exchange}
    publisher-confirm-timeout-ms: ${RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}
    queue:
      image-uploaded: ${RABBITMQ_QUEUE_IMAGE_UPLOADED:image.uploaded.queue}
    routing-key:
      image-uploaded: ${RABBITMQ_ROUTING_KEY_UPLOADED:image.uploaded}

  # Upload configuration
  upload:
    max-file-size-mb: 20
    allowed-formats: JPEG,JPG,PNG,WEBP,GIF,BMP
    thumbnail-width-px: 400
    batch-timeout-minutes: 15

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:miniopassword}
  bucket-images: images
  bucket-thumbnails: thumbnails
  presigned-url-expiry-seconds: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:604800}

jwt:
  # Must be at least 32 characters (256 bits) for HS256. Set JWT_SECRET outside source control.
  secret: ${JWT_SECRET:amzmhvcoqbyhwsbwidvqlsrvtsktvtbp}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

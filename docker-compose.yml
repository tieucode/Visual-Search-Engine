services:
  postgres:
    image: postgres:16-alpine
    container_name: visual-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visual_search_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visual_search_db}
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - visual-search-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: visual-search-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - visual-search-net

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: visual-search-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
      MINIO_BROWSER: "on"
      MINIO_DEFAULT_BUCKETS: "${MINIO_BUCKET_IMAGES:-images},${MINIO_BUCKET_THUMBNAILS:-thumbnails}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - visual-search-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: visual-search-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visual-search-net

  # ai-service:
  #   build:
  #     context: ./ai-service
  #     dockerfile: Dockerfile
  #   container_name: visual-search-ai-service
  #   restart: unless-stopped
  #   ports:
  #     - "${AI_SERVICE_PORT:-8000}:8000"
  #   environment:
  #     APP_ENV: production
  #     SIGLIP_MODEL_NAME: ${SIGLIP_MODEL_NAME:-google/siglip-base-patch16-224}
  #     EASYOCR_LANGUAGES: ${EASYOCR_LANGUAGES:-en,vi}
  #   volumes:
  #     - ai_models_cache:/root/.cache
  #   networks:
  #     - visual-search-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visual-search-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-visual_search_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword}
      MINIO_PRESIGNED_URL_EXPIRY_SECONDS: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:-604800}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-visual.search.exchange}
      RABBITMQ_QUEUE_IMAGE_UPLOADED: ${RABBITMQ_QUEUE_IMAGE_UPLOADED:-image.uploaded.queue}
      RABBITMQ_ROUTING_KEY_UPLOADED: ${RABBITMQ_ROUTING_KEY_UPLOADED:-image.uploaded}
      RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT_MS: ${RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT_MS:-5000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:8080/v3/api-docs || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - visual-search-net

  indexing-service:
    build:
      context: ./indexing-service
      dockerfile: Dockerfile
    container_name: visual-search-indexing-service
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "${INDEXING_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-visual_search_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-visual.search.exchange}
      RABBITMQ_QUEUE_IMAGE_UPLOADED: ${RABBITMQ_QUEUE_IMAGE_UPLOADED:-image.uploaded.queue}
      RABBITMQ_ROUTING_KEY_UPLOADED: ${RABBITMQ_ROUTING_KEY_UPLOADED:-image.uploaded}
      RABBITMQ_RETRY_EXCHANGE: ${RABBITMQ_RETRY_EXCHANGE:-visual.search.retry.exchange}
      RABBITMQ_RETRY_QUEUE: ${RABBITMQ_RETRY_QUEUE:-image.uploaded.retry.15m.queue}
      RABBITMQ_RETRY_ROUTING_KEY: ${RABBITMQ_RETRY_ROUTING_KEY:-image.uploaded.retry}
      RABBITMQ_DLX_EXCHANGE: ${RABBITMQ_DLX_EXCHANGE:-visual.search.dlq.exchange}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ:-image.uploaded.dlq}
      RABBITMQ_DLQ_ROUTING_KEY: ${RABBITMQ_DLQ_ROUTING_KEY:-image.uploaded.dlq}
      RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT: ${RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT:-5s}
      INDEXING_RETRY_DELAY: ${INDEXING_RETRY_DELAY:-15m}
      INDEXING_MAX_RETRIES: ${INDEXING_MAX_RETRIES:-3}
      INDEXING_MAX_IMAGE_BYTES: ${INDEXING_MAX_IMAGE_BYTES:-20971520}
      INDEXING_MAX_IMAGE_PIXELS: ${INDEXING_MAX_IMAGE_PIXELS:-40000000}
      INDEXING_MAX_IMAGE_DIMENSION: ${INDEXING_MAX_IMAGE_DIMENSION:-1024}
      INDEXING_MAX_BATCH_IMAGES: ${INDEXING_MAX_BATCH_IMAGES:-20}
      INDEXING_ALLOWED_IMAGE_HOSTS: ${INDEXING_ALLOWED_IMAGE_HOSTS:-minio,localhost}
      INDEXING_IMAGE_CONNECT_TIMEOUT: ${INDEXING_IMAGE_CONNECT_TIMEOUT:-3s}
      INDEXING_IMAGE_REQUEST_TIMEOUT: ${INDEXING_IMAGE_REQUEST_TIMEOUT:-30s}
      INDEXING_SHUTDOWN_TIMEOUT: ${INDEXING_SHUTDOWN_TIMEOUT:-60s}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-3s}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-60s}
      AI_HEALTH_PATH: ${AI_HEALTH_PATH:-/health}
      AI_HEALTH_CHECK_INTERVAL: ${AI_HEALTH_CHECK_INTERVAL:-30s}
      AI_CIRCUIT_FAILURE_THRESHOLD: ${AI_CIRCUIT_FAILURE_THRESHOLD:-5}
      AI_CIRCUIT_OPEN_DURATION: ${AI_CIRCUIT_OPEN_DURATION:-60s}
      QDRANT_BASE_URL: ${QDRANT_BASE_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-images}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-768}
      QDRANT_CONNECT_TIMEOUT: ${QDRANT_CONNECT_TIMEOUT:-3s}
      QDRANT_REQUEST_TIMEOUT: ${QDRANT_REQUEST_TIMEOUT:-10s}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      # ai-service:
      #   condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:8081/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - visual-search-net
  frontend:
    build:
      context: ./indexing-service
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: visual-search-frontend
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      ai-service:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:8081/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - visual-search-net
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: visual-search-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "${FRONTEND_PORT:-3000}:80"
  #   environment:
  #     VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
  #   depends_on:
  #     backend:
  #       condition: service_started
  #   networks:
  #     - visual-search-net

networks:
  visual-search-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  rabbitmq_data:
  ai_models_cache:
